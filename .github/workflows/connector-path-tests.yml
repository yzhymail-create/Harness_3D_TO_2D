name: Connector path regression tests

on:
  push:
    branches:
      - feature/connector-to-connector-longest-path
  pull_request:
    branches:
      - master

jobs:
  connector-path-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run connector path unit tests
        working-directory: connector_path_update
        run: python -m unittest discover -s tests -v
